name: B3 Stock Selector — Estudo 34 Etapas

on:
  workflow_dispatch:
  schedule:
    # Segunda a sexta, 11:00 UTC (08:00 em Brasília, UTC-3)
    - cron: "0 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: b3-stock-selector
  cancel-in-progress: false

jobs:
  run-b3-selector:
    name: Pesquisa B3 — auditoria das 34 etapas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q main.py config.py data engines reports

      - name: Test PIT Engine
        run: python -m data.pit

      - name: Test Market Engine
        run: python -m data.market

      - name: Test Accounting Engine
        run: python -m data.accounting

      - name: Test Universe Engine
        run: python -m engines.universe

      - name: Test Investability Engine
        run: python -m engines.investability

      - name: Test Fundamentals Engine
        run: python -m engines.fundamentals

      - name: Test Quality Engine
        run: python -m engines.quality

      - name: Test Turnaround Engine
        run: python -m engines.turnaround

      - name: Test Valuation Engine
        run: python -m engines.valuation

      - name: Test Ranking Engine
        run: python -m engines.ranking

      - name: Test Risk Engine
        run: python -m engines.risk

      - name: Test Report Engine
        run: python -m reports.report

      - name: Test Email Report Safety Offline
        run: |
          python - <<'PY'
          from reports.email_report import _self_test
          if _self_test() is not True:
              raise RuntimeError('FAIL-SAFE: autoteste do relatório por e-mail falhou.')
          print('Email safety: OK (sem envio real)')
          PY

      - name: Validate configuration
        run: |
          python - <<'PY'
          from config import validate_config
          validate_config()
          print('Configuração: verificação executada; não equivale a auditoria PIT integral.')
          PY

      - name: Validate Turnaround production lock
        run: |
          python - <<'PY'
          from config import TURNAROUND_ENGINE
          if not isinstance(TURNAROUND_ENGINE, dict):
              raise RuntimeError('FAIL-SAFE: TURNAROUND_ENGINE inválido.')
          if TURNAROUND_ENGINE.get('production_authorized') is not False:
              raise RuntimeError('FAIL-SAFE: turnaround não pode operar em produção.')
          print('Turnaround: pesquisa apenas; seleção proibida.')
          PY

      - name: Prepare isolated outputs
        run: |
          # Evita reaproveitar resultados de uma execução anterior.
          rm -rf outputs
          mkdir -p outputs

      - name: Run Main Pipeline
        run: python main.py --run

      - name: Validate scientific audit manifest
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from reports.email_report import _validate_manifest

          paths = sorted(Path('outputs/runs').glob('run_manifest_*.json'))
          if len(paths) != 1:
              raise RuntimeError(
                  f'FAIL-SAFE: esperado 1 manifesto desta execução; encontrados {len(paths)}.'
              )
          path = paths[0]
          manifest = json.loads(path.read_text(encoding='utf-8'))
          _validate_manifest(manifest)
          audit = manifest['audit']
          if audit.get('study_34_status') != 'PENDENTE':
              raise RuntimeError('FAIL-SAFE: estado científico não é PENDENTE.')
          count = audit.get('study_34_approval_count')
          if isinstance(count, bool) or count != 0:
              raise RuntimeError('FAIL-SAFE: aprovações não comprovadas.')
          if audit.get('recommendations_authorized') is not False:
              raise RuntimeError('FAIL-SAFE: recomendações indevidamente autorizadas.')
          if not manifest.get('stage_files'):
              raise RuntimeError('FAIL-SAFE: manifesto sem arquivos de etapas.')
          print('Manifesto validado:', path)
          print('Status: PENDENTE; zero seleções e zero recomendações.')
          print('Este controle não certifica a validade econômica das 34 etapas.')
          PY

      - name: Validate generated outputs
        shell: bash
        run: |
          test -d outputs
          test "$(find outputs -type f | wc -l)" -gt 0
          find outputs -type f -print

      - name: Send pending research report by Gmail
        if: success()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m reports.email_report

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-study34-${{ github.run_number }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 30

      - name: Execution summary
        if: success()
        shell: bash
        run: |
          {
            echo '## B3 Stock Selector — Estudo das 34 etapas'
            echo ''
            echo '- Execução técnica: concluída'
            echo '- Manifesto: validado como PENDENTE'
            echo '- Empresas integralmente aprovadas: 0 (conforme manifesto)'
            echo '- Carteiras e recomendações: bloqueadas'
            echo '- Auditoria econômica integral: ainda não certificada'
            echo ''
            echo '### Arquivos produzidos'
            echo '```text'
            find outputs -type f -print
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
